<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2214" />
      <stop offset="100%" stop-color="#190e07" />
    </radialGradient>
    <radialGradient id="shellGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fffdf5" />
      <stop offset="45%" stop-color="#fcedc7" />
      <stop offset="80%" stop-color="#d6af58" />
      <stop offset="100%" stop-color="#a67c24" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#693c1f" stroke-width="12" />

  <!-- Traditional X Safe Katta motif behind -->
  <line x1="80" y1="80" x2="432" y2="432" stroke="#8a2714" stroke-width="28" stroke-linecap="round" opacity="0.45" />
  <line x1="432" y1="80" x2="80" y2="432" stroke="#8a2714" stroke-width="28" stroke-linecap="round" opacity="0.45" />

  <!-- Central Cowrie Shell -->
  <g transform="translate(136, 66) scale(4)" filter="url(#shadow)">
    <!-- Outer Shell Body -->
    <path d="M 30,5 C 48,5 56,30 56,50 C 56,72 45,86 30,86 C 15,86 4,72 4,50 C 4,30 12,5 30,5 Z" 
          fill="url(#shellGrad)" stroke="#7a5518" stroke-width="2" />
    
    <!-- Central Mouth Opening -->
    <path d="M 30,14 Q 35,50 30,78 Q 25,50 30,14 Z" fill="#38200a" stroke="#1f1003" stroke-width="1.2" />

    <!-- Ribbed teeth ridges -->
    <line x1="22" y1="26" x2="30" y2="26" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />
    <line x1="30" y1="26" x2="38" y2="26" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />

    <line x1="20" y1="36" x2="29" y2="36" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />
    <line x1="31" y1="36" x2="40" y2="36" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />

    <line x1="19" y1="46" x2="29" y2="46" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />
    <line x1="31" y1="46" x2="41" y2="46" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />

    <line x1="20" y1="56" x2="29" y2="56" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />
    <line x1="31" y1="56" x2="40" y2="56" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />

    <line x1="23" y1="66" x2="30" y2="66" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />
    <line x1="30" y1="66" x2="37" y2="66" stroke="#ebd9af" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Title banner -->
  <rect x="76" y="420" width="360" height="52" rx="14" fill="#241309" stroke="#f39c12" stroke-width="4" opacity="0.95" />
  <text x="256" y="456" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffdf9e" text-anchor="middle" letter-spacing="3">BHARAKHATTA</text>
</svg>
